<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero A/B 플레이그라운드 — Samsung Korea</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../components.css">
  <style>
    /* ---------- Playground chrome ---------- */
    .pg-app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--vdx-colors-surface-page);
    }

    .pg-toolbar {
      position: sticky;
      top: 0;
      z-index: var(--vdx-z-index-sticky);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--vdx-spacing-4);
      padding: var(--vdx-spacing-4) var(--vdx-spacing-6);
      background: var(--vdx-colors-surface-card);
      border-bottom: 1px solid var(--vdx-colors-border-subtle);
      box-shadow: var(--vdx-shadow-sm);
    }

    .pg-title {
      font-family: var(--vdx-typography-font-family-display);
      font-weight: var(--vdx-typography-font-weight-bold);
      font-size: var(--vdx-typography-font-size-body-l);
      letter-spacing: var(--vdx-typography-letter-spacing-tight);
      color: var(--vdx-colors-text-primary);
      margin: 0;
      margin-right: var(--vdx-spacing-4);
    }

    .pg-tagline {
      color: var(--vdx-colors-text-muted);
      font-size: var(--vdx-typography-font-size-body-s);
    }

    .pg-spacer { flex: 1; }

    .pg-segment {
      display: inline-flex;
      gap: var(--vdx-spacing-1);
      padding: var(--vdx-spacing-1);
      background: var(--vdx-colors-neutral-100);
      border-radius: var(--vdx-radius-pill);
    }

    .pg-segment label {
      cursor: pointer;
    }

    .pg-segment input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .pg-segment-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: var(--vdx-spacing-12);
      height: var(--vdx-components-button-height);
      padding-inline: var(--vdx-spacing-5);
      border-radius: var(--vdx-radius-pill);
      font-weight: var(--vdx-components-button-font-weight);
      font-size: var(--vdx-typography-font-size-body-s);
      color: var(--vdx-colors-text-secondary);
      transition: background var(--vdx-motion-duration-fast) var(--vdx-motion-easing-standard),
                  color var(--vdx-motion-duration-fast) var(--vdx-motion-easing-standard);
      user-select: none;
    }

    .pg-segment input:checked + .pg-segment-btn {
      background: var(--vdx-colors-brand-primary);
      color: var(--vdx-colors-text-on-brand);
    }

    .pg-segment input:focus-visible + .pg-segment-btn {
      outline: 2px solid var(--vdx-colors-brand-accent);
      outline-offset: 2px;
    }

    .pg-segment-label {
      font-weight: var(--vdx-typography-font-weight-bold);
      letter-spacing: var(--vdx-typography-letter-spacing-wide);
      margin-right: var(--vdx-spacing-2);
    }

    .pg-segment-name {
      color: inherit;
      opacity: 0.85;
    }

    .pg-stage {
      flex: 1;
      padding: var(--vdx-spacing-6);
      background: var(--vdx-colors-neutral-50);
    }

    .pg-frame {
      background: var(--vdx-colors-surface-card);
      border: 1px solid var(--vdx-colors-border-subtle);
      border-radius: var(--vdx-radius-lg);
      overflow: hidden;
      box-shadow: var(--vdx-shadow-md);
    }

    .pg-toast {
      position: fixed;
      left: 50%;
      bottom: var(--vdx-spacing-12);
      transform: translateX(-50%);
      padding: var(--vdx-spacing-3) var(--vdx-spacing-6);
      background: var(--vdx-colors-surface-inverse);
      color: var(--vdx-colors-text-on-inverse);
      border-radius: var(--vdx-radius-pill);
      font-size: var(--vdx-typography-font-size-body-s);
      font-weight: var(--vdx-typography-font-weight-semibold);
      box-shadow: var(--vdx-shadow-lg);
      z-index: var(--vdx-z-index-toast);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--vdx-motion-duration-base) var(--vdx-motion-easing-standard);
    }

    .pg-toast.is-visible {
      opacity: 1;
    }

    /* ---------- Fullscreen mode ---------- */
    .pg-app.is-fullscreen .pg-toolbar {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
      transition: transform var(--vdx-motion-duration-base) var(--vdx-motion-easing-standard),
                  opacity var(--vdx-motion-duration-base) var(--vdx-motion-easing-standard);
    }

    .pg-app.is-fullscreen .pg-stage {
      padding: var(--vdx-spacing-0);
    }

    .pg-app.is-fullscreen .pg-frame {
      border: none;
      border-radius: var(--vdx-radius-none);
      box-shadow: var(--vdx-shadow-none);
    }

    .pg-fs-exit {
      position: fixed;
      top: var(--vdx-spacing-4);
      right: var(--vdx-spacing-4);
      z-index: var(--vdx-z-index-modal);
      display: none;
    }

    .pg-app.is-fullscreen .pg-fs-exit {
      display: inline-flex;
    }

    /* ---------- Hero variant A: Text-led centered ---------- */
    .hero-a {
      position: relative;
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--vdx-colors-surface-elevated);
      padding-block: var(--vdx-spacing-24);
      overflow: hidden;
    }

    .hero-a__inner {
      max-width: var(--vdx-layout-narrow);
      padding-inline: var(--vdx-spacing-6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--vdx-spacing-6);
    }

    .hero-a__eyebrow {
      text-transform: uppercase;
      font-size: var(--vdx-typography-font-size-body-s);
      letter-spacing: var(--vdx-typography-letter-spacing-wide);
      font-weight: var(--vdx-typography-font-weight-semibold);
      color: var(--vdx-colors-brand-secondary);
    }

    .hero-a__heading {
      font-family: var(--vdx-typography-font-family-display);
      font-size: var(--vdx-typography-font-size-display-xl);
      font-weight: var(--vdx-typography-font-weight-bold);
      letter-spacing: var(--vdx-typography-letter-spacing-tight);
      line-height: var(--vdx-typography-line-height-tight);
      color: var(--vdx-colors-text-primary);
      margin: 0;
    }

    .hero-a__subhead {
      font-size: var(--vdx-typography-font-size-body-l);
      color: var(--vdx-colors-text-secondary);
      max-width: var(--vdx-layout-narrow);
      margin: 0;
    }

    .hero-a__actions {
      display: flex;
      gap: var(--vdx-spacing-4);
      flex-wrap: wrap;
      justify-content: center;
    }

    .hero-a__media {
      margin-top: var(--vdx-spacing-8);
      width: 100%;
      max-width: var(--vdx-layout-narrow);
      border-radius: var(--vdx-radius-lg);
      overflow: hidden;
      background: var(--vdx-colors-neutral-100);
    }

    .hero-a__media img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ---------- Hero variant B: Split image-led ---------- */
    .hero-b {
      background: var(--vdx-colors-surface-elevated);
    }

    .hero-b__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: var(--vdx-spacing-12);
      max-width: var(--vdx-layout-wide);
      margin: 0 auto;
      padding: var(--vdx-spacing-20) var(--vdx-spacing-6);
    }

    .hero-b__text {
      display: flex;
      flex-direction: column;
      gap: var(--vdx-spacing-5);
    }

    .hero-b__eyebrow {
      text-transform: uppercase;
      font-size: var(--vdx-typography-font-size-body-s);
      letter-spacing: var(--vdx-typography-letter-spacing-wide);
      font-weight: var(--vdx-typography-font-weight-semibold);
      color: var(--vdx-colors-brand-secondary);
    }

    .hero-b__heading {
      font-family: var(--vdx-typography-font-family-display);
      font-size: var(--vdx-typography-font-size-display-m);
      font-weight: var(--vdx-typography-font-weight-bold);
      letter-spacing: var(--vdx-typography-letter-spacing-tight);
      line-height: var(--vdx-typography-line-height-tight);
      color: var(--vdx-colors-text-primary);
      margin: 0;
    }

    .hero-b__subhead {
      font-size: var(--vdx-typography-font-size-body-l);
      color: var(--vdx-colors-text-secondary);
      margin: 0;
    }

    .hero-b__actions {
      display: flex;
      gap: var(--vdx-spacing-4);
      flex-wrap: wrap;
      margin-top: var(--vdx-spacing-2);
    }

    .hero-b__media {
      border-radius: var(--vdx-radius-lg);
      overflow: hidden;
      background: var(--vdx-colors-neutral-100);
      aspect-ratio: 4 / 3;
    }

    .hero-b__media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ---------- Hero variant C: Full-bleed minimal ---------- */
    .hero-c {
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--vdx-colors-surface-inverse);
      color: var(--vdx-colors-text-on-inverse);
      padding: var(--vdx-spacing-24) var(--vdx-spacing-6);
    }

    .hero-c__inner {
      max-width: var(--vdx-layout-narrow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--vdx-spacing-8);
    }

    .hero-c__tagline {
      font-family: var(--vdx-typography-font-family-display);
      font-size: var(--vdx-typography-font-size-display-l);
      font-weight: var(--vdx-typography-font-weight-bold);
      letter-spacing: var(--vdx-typography-letter-spacing-tight);
      line-height: var(--vdx-typography-line-height-tight);
      margin: 0;
    }

    .hero-c__caption {
      font-size: var(--vdx-typography-font-size-body-l);
      color: var(--vdx-colors-text-on-inverse-secondary);
      margin: 0;
    }

    /* ---------- Mobile breakpoint at 720px ---------- */
    @media (max-width: 720px) {
      .pg-toolbar {
        gap: var(--vdx-spacing-3);
        padding: var(--vdx-spacing-3) var(--vdx-spacing-4);
      }
      .pg-spacer { flex-basis: 100%; height: 0; }
      .pg-stage { padding: var(--vdx-spacing-3); }

      .hero-a { min-height: auto; padding-block: var(--vdx-spacing-16); }
      .hero-a__heading { font-size: var(--vdx-typography-font-size-display-m); }
      .hero-a__inner { gap: var(--vdx-spacing-5); }

      .hero-b__grid {
        grid-template-columns: 1fr;
        padding: var(--vdx-spacing-12) var(--vdx-spacing-4);
        gap: var(--vdx-spacing-8);
      }
      .hero-b__heading { font-size: var(--vdx-typography-font-size-h1); }

      .hero-c { min-height: auto; padding: var(--vdx-spacing-16) var(--vdx-spacing-4); }
      .hero-c__tagline { font-size: var(--vdx-typography-font-size-display-m); }
    }

    /* ---------- Reduced motion guard ---------- */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <div class="pg-app" id="pgApp">

    <header class="pg-toolbar" role="toolbar" aria-label="Hero 플레이그라운드 도구 모음">
      <h1 class="pg-title">Hero A/B 플레이그라운드</h1>
      <span class="pg-tagline">Samsung Korea — VDX</span>

      <div class="pg-spacer"></div>

      <fieldset class="pg-segment" aria-label="Hero 디자인 변형 선택">
        <legend class="visually-hidden" hidden>Hero 변형</legend>

        <label>
          <input type="radio" name="variant" value="a" checked>
          <span class="pg-segment-btn">
            <span class="pg-segment-label">A</span>
            <span class="pg-segment-name">중앙 텍스트형</span>
          </span>
        </label>

        <label>
          <input type="radio" name="variant" value="b">
          <span class="pg-segment-btn">
            <span class="pg-segment-label">B</span>
            <span class="pg-segment-name">이미지 분할형</span>
          </span>
        </label>

        <label>
          <input type="radio" name="variant" value="c">
          <span class="pg-segment-btn">
            <span class="pg-segment-label">C</span>
            <span class="pg-segment-name">풀블리드 미니멀</span>
          </span>
        </label>
      </fieldset>

      <button class="btn btn-ghost btn-sm" type="button" id="copyBtn">스니펫 복사</button>
      <button class="btn btn-primary btn-sm" type="button" id="fsBtn" aria-pressed="false">전체 화면</button>
    </header>

    <main class="pg-stage">
      <div class="pg-frame" id="previewFrame">
        <!-- Hero variant rendered here by script -->
      </div>
    </main>

    <button class="btn btn-ghost btn-sm pg-fs-exit" type="button" id="fsExitBtn">전체 화면 종료</button>

    <div class="pg-toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- Templates: each holds an HTML string for one hero variant -->
  <template id="tpl-a">
<section class="hero-a" aria-labelledby="hero-a-heading">
  <div class="hero-a__inner">
    <p class="hero-a__eyebrow">Galaxy 신제품</p>
    <h2 class="hero-a__heading" id="hero-a-heading">미래는<br>당신의 손 안에.</h2>
    <p class="hero-a__subhead">Galaxy AI가 일상의 모든 순간을 더 똑똑하고 자연스럽게 바꿉니다. 지금, 새로운 가능성을 만나보세요.</p>
    <div class="hero-a__actions">
      <a class="btn btn-primary btn-lg" href="#">사전예약 하기</a>
      <a class="btn btn-ghost btn-lg" href="#">자세히 보기</a>
    </div>
    <figure class="hero-a__media">
      <img src="https://placehold.co/1200x600?text=Galaxy" alt="Galaxy 신제품 이미지" loading="lazy" width="1200" height="600">
    </figure>
  </div>
</section>
  </template>

  <template id="tpl-b">
<section class="hero-b" aria-labelledby="hero-b-heading">
  <div class="hero-b__grid">
    <div class="hero-b__text">
      <p class="hero-b__eyebrow">Galaxy Z Fold7</p>
      <h2 class="hero-b__heading" id="hero-b-heading">접고 펼치는<br>새로운 일상.</h2>
      <p class="hero-b__subhead">더 가벼워진 폴더블 디자인과 한층 똑똑해진 카메라로 매일을 새롭게.</p>
      <div class="hero-b__actions">
        <a class="btn btn-primary btn-lg" href="#">사전예약 하기</a>
        <a class="btn btn-secondary btn-lg" href="#">기능 살펴보기</a>
      </div>
    </div>
    <figure class="hero-b__media">
      <img src="https://placehold.co/960x720?text=Galaxy" alt="Galaxy 신제품 이미지" loading="lazy" width="960" height="720">
    </figure>
  </div>
</section>
  </template>

  <template id="tpl-c">
<section class="hero-c" aria-labelledby="hero-c-heading">
  <div class="hero-c__inner">
    <h2 class="hero-c__tagline" id="hero-c-heading">단순함이 만드는<br>가장 강력한 경험.</h2>
    <p class="hero-c__caption">Galaxy와 함께, 일상을 다시 정의합니다.</p>
    <a class="btn btn-accent btn-lg" href="#">지금 만나보기</a>
  </div>
</section>
  </template>

  <script>
    (function () {
      'use strict';

      var app = document.getElementById('pgApp');
      var frame = document.getElementById('previewFrame');
      var copyBtn = document.getElementById('copyBtn');
      var fsBtn = document.getElementById('fsBtn');
      var fsExitBtn = document.getElementById('fsExitBtn');
      var toast = document.getElementById('toast');
      var radios = document.querySelectorAll('input[name="variant"]');

      var TEMPLATES = {
        a: document.getElementById('tpl-a'),
        b: document.getElementById('tpl-b'),
        c: document.getElementById('tpl-c')
      };

      var currentVariant = 'a';
      var toastTimer = null;

      function getSnippet(variant) {
        var tpl = TEMPLATES[variant];
        if (!tpl) return '';
        // innerHTML of <template> preserves the markup as authored.
        return tpl.innerHTML.trim();
      }

      function render(variant) {
        currentVariant = variant;
        frame.innerHTML = getSnippet(variant);
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('is-visible');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('is-visible');
        }, 1800);
      }

      function copySnippet() {
        var snippet = getSnippet(currentVariant);
        if (!snippet) return;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(snippet).then(
            function () { showToast('스니펫이 복사되었습니다.'); },
            function () { fallbackCopy(snippet); }
          );
        } else {
          fallbackCopy(snippet);
        }
      }

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.setAttribute('aria-hidden', 'true');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('스니펫이 복사되었습니다.');
        } catch (e) {
          showToast('복사에 실패했습니다.');
        }
        document.body.removeChild(ta);
      }

      function toggleFullscreen(force) {
        var nextOn = typeof force === 'boolean'
          ? force
          : !app.classList.contains('is-fullscreen');
        app.classList.toggle('is-fullscreen', nextOn);
        fsBtn.setAttribute('aria-pressed', String(nextOn));
        fsBtn.textContent = nextOn ? '도구 모음 표시' : '전체 화면';
      }

      // Wire up radios
      Array.prototype.forEach.call(radios, function (radio) {
        radio.addEventListener('change', function () {
          if (radio.checked) render(radio.value);
        });
      });

      copyBtn.addEventListener('click', copySnippet);
      fsBtn.addEventListener('click', function () { toggleFullscreen(); });
      fsExitBtn.addEventListener('click', function () { toggleFullscreen(false); });

      // Escape exits fullscreen
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && app.classList.contains('is-fullscreen')) {
          toggleFullscreen(false);
        }
      });

      // Initial render
      render('a');
    }());
  </script>

</body>
</html>
