<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>색상 팔레트 탐색기 — Samsung Korea</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: var(--vdx-typography-font-family-sans);
      background: var(--vdx-colors-surface-page);
      color: var(--vdx-colors-text-primary);
      line-height: var(--vdx-typography-line-height-normal);
      transition: background var(--vdx-motion-duration-base) var(--vdx-motion-easing-standard),
                  color var(--vdx-motion-duration-base) var(--vdx-motion-easing-standard);
    }

    body.dark {
      background: var(--vdx-colors-surface-inverse);
      color: var(--vdx-colors-text-on-inverse);
    }

    .page {
      max-width: var(--vdx-layout-content);
      margin: 0 auto;
      padding: var(--vdx-spacing-8) var(--vdx-spacing-6) var(--vdx-spacing-16);
    }

    .header {
      margin-bottom: var(--vdx-spacing-8);
    }

    .header h1 {
      font-family: var(--vdx-typography-font-family-display);
      font-size: var(--vdx-typography-font-size-h1);
      font-weight: var(--vdx-typography-font-weight-bold);
      letter-spacing: var(--vdx-typography-letter-spacing-tight);
      line-height: var(--vdx-typography-line-height-tight);
      margin: 0 0 var(--vdx-spacing-2);
    }

    .header p {
      font-size: var(--vdx-typography-font-size-body-m);
      color: var(--vdx-colors-text-muted);
      margin: 0;
    }

    body.dark .header p {
      color: var(--vdx-colors-text-on-inverse-secondary);
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: var(--vdx-z-index-sticky);
      display: flex;
      flex-wrap: wrap;
      gap: var(--vdx-spacing-6);
      padding: var(--vdx-spacing-4) 0;
      margin-bottom: var(--vdx-spacing-6);
      background: var(--vdx-colors-surface-page);
      border-bottom: 1px solid var(--vdx-colors-border-subtle);
    }

    body.dark .controls {
      background: var(--vdx-colors-surface-inverse);
      border-bottom-color: var(--vdx-colors-border-inverse);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: var(--vdx-spacing-2);
    }

    .control-label {
      font-size: var(--vdx-typography-font-size-caption);
      font-weight: var(--vdx-typography-font-weight-semibold);
      letter-spacing: var(--vdx-typography-letter-spacing-wide);
      text-transform: uppercase;
      color: var(--vdx-colors-text-muted);
    }

    body.dark .control-label {
      color: var(--vdx-colors-text-on-inverse-secondary);
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: var(--vdx-spacing-2);
    }

    .chip {
      appearance: none;
      border: 1px solid var(--vdx-colors-border-default);
      background: var(--vdx-colors-surface-card);
      color: var(--vdx-colors-text-primary);
      font-family: inherit;
      font-size: var(--vdx-typography-font-size-body-s);
      font-weight: var(--vdx-typography-font-weight-medium);
      padding: var(--vdx-spacing-2) var(--vdx-spacing-4);
      border-radius: var(--vdx-radius-pill);
      cursor: pointer;
      transition: background var(--vdx-motion-duration-fast) var(--vdx-motion-easing-standard),
                  color var(--vdx-motion-duration-fast) var(--vdx-motion-easing-standard),
                  border-color var(--vdx-motion-duration-fast) var(--vdx-motion-easing-standard);
    }

    .chip:hover {
      border-color: var(--vdx-colors-border-strong);
    }

    .chip[aria-pressed="true"] {
      background: var(--vdx-colors-brand-primary);
      color: var(--vdx-colors-text-on-brand);
      border-color: var(--vdx-colors-brand-primary);
    }

    body.dark .chip {
      background: var(--vdx-colors-surface-inverse);
      color: var(--vdx-colors-text-on-inverse);
      border-color: var(--vdx-colors-border-inverse);
    }

    body.dark .chip:hover {
      border-color: var(--vdx-colors-text-on-inverse);
    }

    body.dark .chip[aria-pressed="true"] {
      background: var(--vdx-colors-text-on-inverse);
      color: var(--vdx-colors-surface-inverse);
      border-color: var(--vdx-colors-text-on-inverse);
    }

    .group-section {
      margin-bottom: var(--vdx-spacing-12);
    }

    .group-section.is-hidden {
      display: none;
    }

    .group-title {
      font-family: var(--vdx-typography-font-family-display);
      font-size: var(--vdx-typography-font-size-h3);
      font-weight: var(--vdx-typography-font-weight-bold);
      margin: 0 0 var(--vdx-spacing-4);
      text-transform: capitalize;
    }

    /* Card grid view */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--vdx-spacing-6);
    }

    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      display: flex;
      flex-direction: column;
      background: var(--vdx-colors-surface-card);
      border: 1px solid var(--vdx-colors-border-subtle);
      border-radius: var(--vdx-components-card-radius);
      overflow: hidden;
      box-shadow: var(--vdx-shadow-sm);
      transition: transform var(--vdx-motion-duration-fast) var(--vdx-motion-easing-standard),
                  box-shadow var(--vdx-motion-duration-fast) var(--vdx-motion-easing-standard);
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--vdx-shadow-md);
    }

    body.dark .card {
      background: var(--vdx-colors-neutral-900);
      border-color: var(--vdx-colors-border-inverse);
    }

    .swatch {
      width: 100%;
      aspect-ratio: 16 / 9;
      cursor: pointer;
      border: none;
      padding: 0;
      position: relative;
      transition: filter var(--vdx-motion-duration-fast) var(--vdx-motion-easing-standard);
    }

    .swatch:focus-visible {
      outline: 3px solid var(--vdx-colors-brand-accent);
      outline-offset: -3px;
    }

    .swatch:hover {
      filter: brightness(0.96);
    }

    .swatch-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--vdx-typography-font-size-body-s);
      font-weight: var(--vdx-typography-font-weight-semibold);
      letter-spacing: var(--vdx-typography-letter-spacing-wide);
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      background: rgba(0,0,0,0.4);
      color: var(--vdx-colors-text-on-inverse);
      transition: opacity var(--vdx-motion-duration-fast) var(--vdx-motion-easing-standard);
    }

    .swatch:hover .swatch-overlay,
    .swatch:focus-visible .swatch-overlay {
      opacity: 1;
    }

    .swatch.copied .swatch-overlay {
      opacity: 1;
      background: var(--vdx-colors-semantic-success);
    }

    .card-body {
      padding: var(--vdx-spacing-4);
      display: flex;
      flex-direction: column;
      gap: var(--vdx-spacing-2);
    }

    .token-name {
      font-family: var(--vdx-typography-font-family-mono);
      font-size: var(--vdx-typography-font-size-body-s);
      font-weight: var(--vdx-typography-font-weight-semibold);
      word-break: break-all;
      margin: 0;
    }

    .token-meta {
      display: flex;
      flex-wrap: wrap;
      gap: var(--vdx-spacing-2);
      font-size: var(--vdx-typography-font-size-caption);
      color: var(--vdx-colors-text-muted);
    }

    body.dark .token-meta {
      color: var(--vdx-colors-text-on-inverse-secondary);
    }

    .hex {
      font-family: var(--vdx-typography-font-family-mono);
      text-transform: uppercase;
    }

    .contrast-row {
      display: flex;
      flex-direction: column;
      gap: var(--vdx-spacing-1);
      padding-top: var(--vdx-spacing-2);
      border-top: 1px dashed var(--vdx-colors-border-subtle);
    }

    body.dark .contrast-row {
      border-top-color: var(--vdx-colors-border-inverse);
    }

    .contrast-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--vdx-spacing-2);
      font-size: var(--vdx-typography-font-size-caption);
    }

    .contrast-label {
      color: var(--vdx-colors-text-muted);
    }

    body.dark .contrast-label {
      color: var(--vdx-colors-text-on-inverse-secondary);
    }

    .contrast-value {
      font-family: var(--vdx-typography-font-family-mono);
      font-weight: var(--vdx-typography-font-weight-semibold);
    }

    .badge {
      display: inline-block;
      padding: 0 var(--vdx-spacing-2);
      border-radius: var(--vdx-radius-sm);
      font-size: var(--vdx-typography-font-size-caption);
      font-weight: var(--vdx-typography-font-weight-semibold);
      letter-spacing: var(--vdx-typography-letter-spacing-wide);
    }

    .badge.pass {
      background: var(--vdx-colors-semantic-success);
      color: var(--vdx-colors-text-on-brand);
    }

    .badge.fail {
      background: var(--vdx-colors-semantic-danger);
      color: var(--vdx-colors-text-on-brand);
    }

    /* Inline list view */
    .list {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--vdx-colors-border-subtle);
      border-radius: var(--vdx-components-card-radius);
      overflow: hidden;
    }

    body.dark .list {
      border-color: var(--vdx-colors-border-inverse);
    }

    .list-row {
      display: grid;
      grid-template-columns: 80px 1fr auto auto auto;
      align-items: center;
      gap: var(--vdx-spacing-4);
      padding: var(--vdx-spacing-3) var(--vdx-spacing-4);
      border-bottom: 1px solid var(--vdx-colors-border-subtle);
      cursor: pointer;
      background: transparent;
      border-left: none;
      border-right: none;
      border-top: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      color: inherit;
      transition: background var(--vdx-motion-duration-fast) var(--vdx-motion-easing-standard);
    }

    body.dark .list-row {
      border-bottom-color: var(--vdx-colors-border-inverse);
    }

    .list-row:last-child {
      border-bottom: none;
    }

    .list-row:hover {
      background: var(--vdx-colors-surface-elevated);
    }

    body.dark .list-row:hover {
      background: var(--vdx-colors-neutral-900);
    }

    .list-row.copied {
      background: var(--vdx-colors-semantic-success);
      color: var(--vdx-colors-text-on-brand);
    }

    .list-swatch {
      width: 64px;
      height: 32px;
      border-radius: var(--vdx-radius-sm);
      border: 1px solid var(--vdx-colors-border-default);
    }

    .list-token {
      font-family: var(--vdx-typography-font-family-mono);
      font-size: var(--vdx-typography-font-size-body-s);
      font-weight: var(--vdx-typography-font-weight-semibold);
    }

    .list-hex {
      font-family: var(--vdx-typography-font-family-mono);
      font-size: var(--vdx-typography-font-size-caption);
      color: var(--vdx-colors-text-muted);
    }

    body.dark .list-hex {
      color: var(--vdx-colors-text-on-inverse-secondary);
    }

    @media (max-width: 600px) {
      .list-row {
        grid-template-columns: 48px 1fr;
        grid-template-rows: auto auto;
        row-gap: var(--vdx-spacing-1);
      }
      .list-row > .list-token { grid-column: 2; }
      .list-row > .list-swatch { grid-row: 1 / 3; }
      .list-row > .list-hex,
      .list-row > .badge {
        grid-column: 2;
        font-size: var(--vdx-typography-font-size-caption);
      }
    }

    .view-cards .list { display: none; }
    .view-list .grid { display: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: var(--vdx-spacing-8);
      transform: translateX(-50%) translateY(100%);
      background: var(--vdx-colors-surface-inverse);
      color: var(--vdx-colors-text-on-inverse);
      padding: var(--vdx-spacing-3) var(--vdx-spacing-6);
      border-radius: var(--vdx-radius-pill);
      font-size: var(--vdx-typography-font-size-body-s);
      box-shadow: var(--vdx-shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--vdx-motion-duration-base) var(--vdx-motion-easing-standard),
                  transform var(--vdx-motion-duration-base) var(--vdx-motion-easing-standard);
      z-index: var(--vdx-z-index-toast);
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body class="view-cards">

  <div class="page">
    <header class="header">
      <h1>색상 팔레트 탐색기</h1>
      <p>Samsung Korea 테마의 모든 색상 토큰. 스와치를 클릭하면 <code>var(--vdx-colors-...)</code> 가 클립보드에 복사됩니다.</p>
    </header>

    <section class="controls" aria-label="필터 및 표시 옵션">
      <div class="control-group">
        <span class="control-label" id="filter-label">그룹 필터</span>
        <div class="chip-group" role="group" aria-labelledby="filter-label" id="group-filter">
          <button class="chip" type="button" data-group="all" aria-pressed="true">모두</button>
          <button class="chip" type="button" data-group="brand" aria-pressed="false">brand</button>
          <button class="chip" type="button" data-group="neutral" aria-pressed="false">neutral</button>
          <button class="chip" type="button" data-group="semantic" aria-pressed="false">semantic</button>
          <button class="chip" type="button" data-group="surface" aria-pressed="false">surface</button>
          <button class="chip" type="button" data-group="text" aria-pressed="false">text</button>
          <button class="chip" type="button" data-group="border" aria-pressed="false">border</button>
          <button class="chip" type="button" data-group="swatch" aria-pressed="false">swatch</button>
        </div>
      </div>

      <div class="control-group">
        <span class="control-label" id="view-label">표시 형식</span>
        <div class="chip-group" role="group" aria-labelledby="view-label" id="view-toggle">
          <button class="chip" type="button" data-view="cards" aria-pressed="true">카드</button>
          <button class="chip" type="button" data-view="list" aria-pressed="false">인라인 리스트</button>
        </div>
      </div>

      <div class="control-group">
        <span class="control-label" id="dark-label">다크 모드</span>
        <div class="chip-group" role="group" aria-labelledby="dark-label" id="dark-toggle">
          <button class="chip" type="button" data-dark="off" aria-pressed="true">off</button>
          <button class="chip" type="button" data-dark="on" aria-pressed="false">on</button>
        </div>
      </div>
    </section>

    <main id="palette"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /* All color tokens. Hex values are read from theme.json (display-only data). */
    const TOKENS = [
      { group: "brand", name: "primary",         cssName: "brand-primary",         hex: "#000000" },
      { group: "brand", name: "primaryHover",    cssName: "brand-primary-hover",   hex: "#1A1A1A" },
      { group: "brand", name: "secondary",       cssName: "brand-secondary",       hex: "#1428A0" },
      { group: "brand", name: "accent",          cssName: "brand-accent",          hex: "#2189FF" },

      { group: "neutral", name: "0",    cssName: "neutral-0",    hex: "#FFFFFF" },
      { group: "neutral", name: "50",   cssName: "neutral-50",   hex: "#FAFAFA" },
      { group: "neutral", name: "100",  cssName: "neutral-100",  hex: "#F5F5F5" },
      { group: "neutral", name: "200",  cssName: "neutral-200",  hex: "#EEEEEE" },
      { group: "neutral", name: "300",  cssName: "neutral-300",  hex: "#DDDDDD" },
      { group: "neutral", name: "500",  cssName: "neutral-500",  hex: "#767676" },
      { group: "neutral", name: "700",  cssName: "neutral-700",  hex: "#3F3F3F" },
      { group: "neutral", name: "900",  cssName: "neutral-900",  hex: "#1A1A1A" },
      { group: "neutral", name: "1000", cssName: "neutral-1000", hex: "#000000" },

      { group: "semantic", name: "success", cssName: "semantic-success", hex: "#00A96E" },
      { group: "semantic", name: "warning", cssName: "semantic-warning", hex: "#F2A100" },
      { group: "semantic", name: "danger",  cssName: "semantic-danger",  hex: "#E12832" },
      { group: "semantic", name: "info",    cssName: "semantic-info",    hex: "#1428A0" },

      { group: "surface", name: "page",     cssName: "surface-page",     hex: "#FFFFFF" },
      { group: "surface", name: "card",     cssName: "surface-card",     hex: "#FFFFFF" },
      { group: "surface", name: "elevated", cssName: "surface-elevated", hex: "#FAFAFA" },
      { group: "surface", name: "inverse",  cssName: "surface-inverse",  hex: "#000000" },

      { group: "text", name: "primary",             cssName: "text-primary",               hex: "#1A1A1A" },
      { group: "text", name: "secondary",           cssName: "text-secondary",             hex: "#3F3F3F" },
      { group: "text", name: "muted",               cssName: "text-muted",                 hex: "#767676" },
      { group: "text", name: "onBrand",             cssName: "text-on-brand",              hex: "#FFFFFF" },
      { group: "text", name: "onInverse",           cssName: "text-on-inverse",            hex: "#FFFFFF" },
      { group: "text", name: "onInverseSecondary", cssName: "text-on-inverse-secondary",  hex: "#CCCCCC" },

      { group: "border", name: "subtle",  cssName: "border-subtle",  hex: "#EEEEEE" },
      { group: "border", name: "default", cssName: "border-default", hex: "#DDDDDD" },
      { group: "border", name: "strong",  cssName: "border-strong",  hex: "#1A1A1A" },
      { group: "border", name: "inverse", cssName: "border-inverse", hex: "#3F3F3F" },

      { group: "swatch", name: "mint",  cssName: "swatch-mint",  hex: "#B5D9C4" },
      { group: "swatch", name: "black", cssName: "swatch-black", hex: "#1A1A1A" },
      { group: "swatch", name: "blue",  cssName: "swatch-blue",  hex: "#C7D5E6" },
      { group: "swatch", name: "pink",  cssName: "swatch-pink",  hex: "#E5C4C4" },
    ];

    const TEXT_PRIMARY_HEX = "#1A1A1A";   /* matches --vdx-colors-text-primary */
    const SURFACE_INVERSE_HEX = "#000000"; /* matches --vdx-colors-surface-inverse */

    /* WCAG relative luminance + contrast ratio */
    function hexToRgb(hex) {
      const h = hex.replace("#", "");
      const v = h.length === 3
        ? h.split("").map(c => parseInt(c + c, 16))
        : [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
      return v;
    }
    function relLum(hex) {
      const [r,g,b] = hexToRgb(hex).map(v => {
        const s = v / 255;
        return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
      });
      return 0.2126*r + 0.7152*g + 0.0722*b;
    }
    function contrast(hex1, hex2) {
      const L1 = relLum(hex1), L2 = relLum(hex2);
      const [a, b] = L1 > L2 ? [L1, L2] : [L2, L1];
      return (a + 0.05) / (b + 0.05);
    }
    function badge(ratio) {
      const passAA = ratio >= 4.5;
      const formatted = ratio.toFixed(2) + ":1";
      const mark = passAA ? "✓ AA" : "✗";
      return { text: `${formatted} ${mark}`, pass: passAA, ratio };
    }

    /* Render */
    const palette = document.getElementById("palette");
    const groups = ["brand","neutral","semantic","surface","text","border","swatch"];

    function makeContrastInfo(token) {
      return [
        { label: "vs text-primary",     ...badge(contrast(token.hex, TEXT_PRIMARY_HEX)) },
        { label: "vs surface-inverse",  ...badge(contrast(token.hex, SURFACE_INVERSE_HEX)) },
      ];
    }

    function buildCard(token) {
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.group = token.group;

      const swatch = document.createElement("button");
      swatch.type = "button";
      swatch.className = "swatch";
      swatch.style.background = `var(--vdx-colors-${token.cssName})`;
      swatch.dataset.cssvar = `--vdx-colors-${token.cssName}`;
      swatch.dataset.hex = token.hex;
      swatch.setAttribute("aria-label", `${token.cssName} 복사`);
      swatch.innerHTML = '<span class="swatch-overlay">var() 복사</span>';

      const body = document.createElement("div");
      body.className = "card-body";

      const name = document.createElement("p");
      name.className = "token-name";
      name.textContent = `--vdx-colors-${token.cssName}`;

      const meta = document.createElement("div");
      meta.className = "token-meta";
      const hex = document.createElement("span");
      hex.className = "hex";
      hex.textContent = token.hex;
      const grp = document.createElement("span");
      grp.textContent = token.group;
      meta.append(hex, grp);

      const contrastRow = document.createElement("div");
      contrastRow.className = "contrast-row";
      makeContrastInfo(token).forEach(c => {
        const line = document.createElement("div");
        line.className = "contrast-line";
        const lbl = document.createElement("span");
        lbl.className = "contrast-label";
        lbl.textContent = c.label;
        const val = document.createElement("span");
        val.className = "contrast-value";
        const b = document.createElement("span");
        b.className = "badge " + (c.pass ? "pass" : "fail");
        b.textContent = c.text;
        val.append(b);
        line.append(lbl, val);
        contrastRow.append(line);
      });

      body.append(name, meta, contrastRow);
      card.append(swatch, body);
      return card;
    }

    function buildListRow(token) {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "list-row";
      row.dataset.cssvar = `--vdx-colors-${token.cssName}`;
      row.dataset.hex = token.hex;
      row.setAttribute("aria-label", `--vdx-colors-${token.cssName} 복사`);

      const sw = document.createElement("span");
      sw.className = "list-swatch";
      sw.style.background = `var(--vdx-colors-${token.cssName})`;

      const tn = document.createElement("span");
      tn.className = "list-token";
      tn.textContent = `--vdx-colors-${token.cssName}`;

      const hx = document.createElement("span");
      hx.className = "list-hex";
      hx.textContent = token.hex;

      const ci = makeContrastInfo(token);
      const b1 = document.createElement("span");
      b1.className = "badge " + (ci[0].pass ? "pass" : "fail");
      b1.textContent = ci[0].text;
      b1.title = ci[0].label;
      const b2 = document.createElement("span");
      b2.className = "badge " + (ci[1].pass ? "pass" : "fail");
      b2.textContent = ci[1].text;
      b2.title = ci[1].label;

      row.append(sw, tn, hx, b1, b2);
      return row;
    }

    groups.forEach(g => {
      const items = TOKENS.filter(t => t.group === g);
      if (!items.length) return;

      const section = document.createElement("section");
      section.className = "group-section";
      section.dataset.group = g;

      const title = document.createElement("h2");
      title.className = "group-title";
      title.textContent = g;

      const grid = document.createElement("div");
      grid.className = "grid";
      items.forEach(t => grid.append(buildCard(t)));

      const list = document.createElement("div");
      list.className = "list";
      items.forEach(t => list.append(buildListRow(t)));

      section.append(title, grid, list);
      palette.append(section);
    });

    /* Filter */
    const groupFilter = document.getElementById("group-filter");
    groupFilter.addEventListener("click", e => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      groupFilter.querySelectorAll(".chip").forEach(c =>
        c.setAttribute("aria-pressed", c === btn ? "true" : "false")
      );
      const target = btn.dataset.group;
      document.querySelectorAll(".group-section").forEach(s => {
        const show = target === "all" || s.dataset.group === target;
        s.classList.toggle("is-hidden", !show);
      });
    });

    /* View toggle */
    const viewToggle = document.getElementById("view-toggle");
    viewToggle.addEventListener("click", e => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      viewToggle.querySelectorAll(".chip").forEach(c =>
        c.setAttribute("aria-pressed", c === btn ? "true" : "false")
      );
      document.body.classList.toggle("view-cards", btn.dataset.view === "cards");
      document.body.classList.toggle("view-list", btn.dataset.view === "list");
    });

    /* Dark mode */
    const darkToggle = document.getElementById("dark-toggle");
    darkToggle.addEventListener("click", e => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      darkToggle.querySelectorAll(".chip").forEach(c =>
        c.setAttribute("aria-pressed", c === btn ? "true" : "false")
      );
      document.body.classList.toggle("dark", btn.dataset.dark === "on");
    });

    /* Copy */
    const toast = document.getElementById("toast");
    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 1600);
    }

    async function copyToken(target) {
      const cssvar = target.dataset.cssvar;
      if (!cssvar) return;
      const text = `var(${cssvar})`;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.append(ta);
        ta.select();
        try { document.execCommand("copy"); } catch {}
        ta.remove();
      }
      target.classList.add("copied");
      setTimeout(() => target.classList.remove("copied"), 900);
      showToast(`복사됨: ${text}`);
    }

    palette.addEventListener("click", e => {
      const swatchBtn = e.target.closest(".swatch, .list-row");
      if (swatchBtn) copyToken(swatchBtn);
    });
  </script>
</body>
</html>
